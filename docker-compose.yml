# Local services for the API. `npm run api:services` starts them; `npm run api:dev`
# runs the API on the host against them. Ports sit one above the defaults so they
# don't collide with anything else running on the Mac. Run compose with
# --env-file api/compose.env: the root .env belongs to the data pipeline.
name: record-crate

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crate
      POSTGRES_PASSWORD: crate
      POSTGRES_DB: crate
    ports: ['5433:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crate -d crate']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6380:6379']
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # The production image, run locally: `docker compose --profile api up --build`.
  api:
    profiles: ['api']
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://crate:crate@postgres:5432/crate
      REDIS_URL: redis://redis:6379
    ports: ['8787:8787']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres:
  redis:
